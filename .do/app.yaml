# Especificación de DigitalOcean App Platform.
# doctl apps create --spec .do/app.yaml   (o importa este archivo desde el panel)
name: flappy-roadster
region: nyc
databases:
  - name: db
    engine: PG
    version: "16"
    production: false   # base de desarrollo (la más barata); cámbialo a true para un clúster gestionado completo
services:
  - name: web
    environment_slug: node-js
    github:
      repo: TU_USUARIO/flappy-roadster
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: VITE_GA_ID
        scope: BUILD_TIME
        value: G-WGVSJK662E
