# Especificación de DigitalOcean App Platform.
# doctl apps create --spec .do/app.yaml   (o importa este archivo desde el panel)
name: flappy-roadster
region: nyc
domains:
  - domain: flappyroadster.simgulary.io
    type: PRIMARY
    zone: simgulary.io
databases:
  - name: db
    engine: PG
    version: "16"
    production: false   # base de desarrollo (la más barata); cámbialo a true para un clúster gestionado completo
services:
  - name: web
    environment_slug: node-js
    github:
      repo: darthony/flappy-roadster
      branch: main
      deploy_on_push: true
    build_command: npm ci --include=dev && npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/health
    envs:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: DATABASE_CA_CERT
        scope: RUN_TIME
        value: ${db.CA_CERT}
      - key: ADMIN_KEY
        scope: RUN_TIME
        type: SECRET
        value: EV[1:meZjONvktnSTRdg0D7HyFjwAixoWCR2W:wEi0STfgd9Y36o4CE4kOv1PKd/rYrS4uyh6ePD/X/1uSg42hl9WHq5jqRqx9jip5NM/UKYcDJJCtPKJwKxttVg==]
      - key: VITE_GA_ID
        scope: BUILD_TIME
        value: G-WGVSJK662E
